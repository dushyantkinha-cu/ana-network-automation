apiVersion: 1

datasources:
  - name: ana-lab
    uid: ana-lab-influx
    type: influxdb
    access: proxy
    url: http://127.0.0.1:8086
    isDefault: true
    editable: false

    jsonData:
      version: Flux
      organization: ana-lab
      defaultBucket: ana-lab
      tlsSkipVerify: false

    secureJsonData:
      token: $__env{GRAFANA_INFLUX_TOKEN}
