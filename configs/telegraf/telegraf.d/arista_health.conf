# Arista EOS - Tier 2 device health
#
# CPU:    30 seconds
# Memory: 30 seconds
# Uptime: 60 seconds

[[inputs.gnmi]]
  addresses = [
    "172.20.20.14:6030", # R1
    "172.20.20.5:6030",  # R2
    "172.20.20.12:6030", # R5
    "172.20.20.8:6030",  # S1
    "172.20.20.11:6030", # S2
    "172.20.20.7:6030"   # S3
  ]

  username = "$ARISTA_USERNAME"
  password = "$ARISTA_PASSWORD"

  tls_enable = false
  path_guessing_strategy = "subscription"

  # Aggregate CPU utilization only.
  [[inputs.gnmi.subscription]]
    name = "arista_cpu"
    path = "/system/cpus/cpu[index=ALL]/state/total/instant"
    subscription_mode = "sample"
    sample_interval = "30s"

  # System memory.
  [[inputs.gnmi.subscription]]
    name = "arista_memory"
    path = "/system/memory/state"
    subscription_mode = "sample"
    sample_interval = "30s"

  # Device uptime.
  [[inputs.gnmi.subscription]]
    name = "arista_uptime"
    path = "/system/state/up-time"
    subscription_mode = "sample"
    sample_interval = "60s"


# EOS memory may arrive from OpenConfig as numeric strings.
[[processors.converter]]
  namepass = ["arista_memory"]

  [processors.converter.fields]
    integer = [
      "physical",
      "used",
      "free",
      "reserved"
    ]
