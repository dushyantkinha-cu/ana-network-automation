# Arista EOS - interface operational state
# Separate from the existing 5-second interface counter stream.

[[inputs.gnmi]]
  addresses = [
    "172.20.20.14:6030", # R1
    "172.20.20.5:6030",  # R2
    "172.20.20.12:6030", # R5
    "172.20.20.8:6030",  # S1
    "172.20.20.11:6030", # S2
    "172.20.20.7:6030"   # S3
  ]

  username = "$ARISTA_USERNAME"
  password = "$ARISTA_PASSWORD"

  tls_enable = false
  path_guessing_strategy = "subscription"

  # Both subscriptions below should be stored as one logical
  # interface-state measurement.
  name_override = "arista_ifstate"

  # Keep only Tier-1 operational metadata.
  # This prevents the /state parent subscription from duplicating
  # the interface counters already collected every 5 seconds.
  fieldinclude = [
    "name",
    "admin_status",
    "oper_status",
    "ifindex",
    "mtu",
    "type",
    "last_change",
    "port_speed",
    "duplex_mode"
  ]

  [[inputs.gnmi.subscription]]
    name = "arista_ifstate_base"
    path = "/interfaces/interface/state"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
    name = "arista_ifstate_ethernet"
    path = "/interfaces/interface/ethernet/state"
    subscription_mode = "sample"
    sample_interval = "10s"
