# Arista EOS SAMPLE telemetry can contain per-field timestamps representing
# the last device-side change rather than the current sample time.
#
# For time-series monitoring, timestamp Arista samples when Telegraf
# receives/processes them. Device semantic timestamps such as last_change
# and last_update remain available as fields.

[[processors.starlark]]
  namepass = [
    "arista_ifcounters",
    "arista_ifstate",
    "arista_cpu",
    "arista_memory",
    "arista_uptime",
    "arista_isis_adj"
  ]
  source = '''
load("time.star", "time")

def apply(metric):
    metric.time = time.now().unix_nano
    return metric
'''
