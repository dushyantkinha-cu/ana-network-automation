# Cross-vendor Tier 2 device-health normalization
#
# Raw vendor measurements are preserved.
#
# Additional canonical measurement:
#
#   net_device_health
#
# Canonical tags:
#   vendor
#   device
#   mgmt_ip
#
# Canonical fields:
#   cpu_util_pct
#   memory_util_pct
#   uptime_seconds

[[processors.starlark]]
  order = 30

  namepass = [
    "arista_cpu",
    "arista_memory",
    "arista_uptime",

    "Cisco-IOS-XE-process-cpu-oper:cpu-usage/cpu-utilization",
    "Cisco-IOS-XE-memory-oper:memory-statistics/memory-statistic",
    "Cisco-IOS-XE-device-hardware-oper:device-hardware-data/device-hardware/device-system-data",

    "srlinux_cpu",
    "srlinux_memory",
    "srlinux_uptime"
  ]

  source = '''
load("time.star", "time")

ARISTA_DEVICES = {
    "172.20.20.14": "R1",
    "172.20.20.5":  "R2",
    "172.20.20.12": "R5",
    "172.20.20.8":  "S1",
    "172.20.20.11": "S2",
    "172.20.20.7":  "S3",
}

CISCO_MGMT = {
    "R3": "172.20.20.9",
    "R4": "172.20.20.13",
}

CISCO_CPU = "Cisco-IOS-XE-process-cpu-oper:cpu-usage/cpu-utilization"
CISCO_MEMORY = "Cisco-IOS-XE-memory-oper:memory-statistics/memory-statistic"
CISCO_SYSTEM = "Cisco-IOS-XE-device-hardware-oper:device-hardware-data/device-hardware/device-system-data"

state = {}


def source_value(metric):
    if "source" in metric.tags:
        return metric.tags["source"]

    return ""


def new_health(metric, vendor):
    out = Metric("net_device_health")
    out.time = metric.time

    source = source_value(metric)

    out.tags["vendor"] = vendor

    if vendor == "arista":
        out.tags["mgmt_ip"] = source

        if source in ARISTA_DEVICES:
            out.tags["device"] = ARISTA_DEVICES[source]
        else:
            out.tags["device"] = source

    elif vendor == "cisco":
        out.tags["device"] = source

        if source in CISCO_MGMT:
            out.tags["mgmt_ip"] = CISCO_MGMT[source]
        else:
            out.tags["mgmt_ip"] = ""

    elif vendor == "nokia":
        out.tags["device"] = "S4"
        out.tags["mgmt_ip"] = source

    return out


def apply(metric):

    # ========================================================
    # Arista EOS
    # ========================================================

    if metric.name == "arista_cpu":
        if "instant" not in metric.fields:
            return metric

        out = new_health(metric, "arista")

        out.fields["cpu_util_pct"] = float(
            metric.fields["instant"]
        )

        return [metric, out]


    if metric.name == "arista_memory":
        source = source_value(metric)

        # Cache physical memory per EOS device.
        # EOS emits memory leaves as separate gNMI metric events.
        if "physical" in metric.fields:
            state["arista_physical_" + source] = int(
                metric.fields["physical"]
            )

            return metric

        # Calculate utilization when the used-memory value arrives.
        if "used" in metric.fields:
            key = "arista_physical_" + source

            if key not in state:
                return metric

            total = float(state[key])
            used = float(metric.fields["used"])

            if total <= 0.0:
                return metric

            out = new_health(metric, "arista")

            out.fields["memory_util_pct"] = (
                used * 100.0 / total
            )

            return [metric, out]

        return metric


    if metric.name == "arista_uptime":
        if "up_time" not in metric.fields:
            return metric

        out = new_health(metric, "arista")

        # OpenConfig up-time is nanoseconds.
        out.fields["uptime_seconds"] = (
            int(metric.fields["up_time"]) // 1000000000
        )

        return [metric, out]


    # ========================================================
    # Cisco IOS-XE
    # ========================================================

    if metric.name == CISCO_CPU:
        if "five_seconds" not in metric.fields:
            return metric

        out = new_health(metric, "cisco")

        out.fields["cpu_util_pct"] = float(
            metric.fields["five_seconds"]
        )

        return [metric, out]


    if metric.name == CISCO_MEMORY:

        # IOS-XE publishes multiple memory pools.
        # Only the main Processor pool represents the value
        # we want to use as device memory utilization.
        if "name" not in metric.tags:
            return metric

        if metric.tags["name"] != "Processor":
            return metric

        if "used_memory" not in metric.fields:
            return metric

        if "total_memory" not in metric.fields:
            return metric

        total = float(metric.fields["total_memory"])
        used = float(metric.fields["used_memory"])

        if total <= 0.0:
            return metric

        out = new_health(metric, "cisco")

        out.fields["memory_util_pct"] = (
            used * 100.0 / total
        )

        return [metric, out]


    if metric.name == CISCO_SYSTEM:
        if "current_time" not in metric.fields:
            return metric

        if "boot_time" not in metric.fields:
            return metric

        current = time.parse_time(
            str(metric.fields["current_time"])
        )

        boot = time.parse_time(
            str(metric.fields["boot_time"])
        )

        uptime = current.unix - boot.unix

        if uptime < 0:
            return metric

        out = new_health(metric, "cisco")

        out.fields["uptime_seconds"] = uptime

        return [metric, out]


    # ========================================================
    # Nokia SR Linux
    # ========================================================

    if metric.name == "srlinux_cpu":
        if "instant" not in metric.fields:
            return metric

        out = new_health(metric, "nokia")

        out.fields["cpu_util_pct"] = float(
            metric.fields["instant"]
        )

        return [metric, out]


    if metric.name == "srlinux_memory":
        if "utilization" not in metric.fields:
            return metric

        out = new_health(metric, "nokia")

        out.fields["memory_util_pct"] = float(
            metric.fields["utilization"]
        )

        return [metric, out]


    if metric.name == "srlinux_uptime":
        if "up_time" not in metric.fields:
            return metric

        out = new_health(metric, "nokia")

        # OpenConfig up-time is nanoseconds.
        out.fields["uptime_seconds"] = (
            int(metric.fields["up_time"]) // 1000000000
        )

        return [metric, out]


    return metric
'''

