# Cross-vendor interface normalization
#
# Preserves all original vendor measurements and additionally creates:
#   net_ifstate
#   net_ifcounters

[[processors.starlark]]
  order = 20

  namepass = [
    "arista_ifcounters",
    "arista_ifstate",
    "Cisco-IOS-XE-interfaces-oper:interfaces/interface",
    "srlinux_ifcounters",
    "srlinux_ifstate"
  ]

  source = '''
ARISTA_DEVICES = {
    "172.20.20.14": "R1",
    "172.20.20.5":  "R2",
    "172.20.20.12": "R5",
    "172.20.20.8":  "S1",
    "172.20.20.11": "S2",
    "172.20.20.7":  "S3",
}

CISCO_MGMT = {
    "R3": "172.20.20.9",
    "R4": "172.20.20.13",
}

SPEEDS = {
    "SPEED_10MB": 10000000,
    "openconfig-if-ethernet:SPEED_10MB": 10000000,

    "SPEED_100MB": 100000000,
    "openconfig-if-ethernet:SPEED_100MB": 100000000,

    "SPEED_1GB": 1000000000,
    "openconfig-if-ethernet:SPEED_1GB": 1000000000,

    "SPEED_2500MB": 2500000000,
    "openconfig-if-ethernet:SPEED_2500MB": 2500000000,

    "SPEED_5GB": 5000000000,
    "openconfig-if-ethernet:SPEED_5GB": 5000000000,

    "SPEED_10GB": 10000000000,
    "openconfig-if-ethernet:SPEED_10GB": 10000000000,

    "SPEED_25GB": 25000000000,
    "openconfig-if-ethernet:SPEED_25GB": 25000000000,

    "SPEED_40GB": 40000000000,
    "openconfig-if-ethernet:SPEED_40GB": 40000000000,

    "SPEED_50GB": 50000000000,
    "SPEED_50GB_1LANE": 50000000000,
    "openconfig-if-ethernet:SPEED_50GB": 50000000000,
    "openconfig-if-ethernet:SPEED_50GB_1LANE": 50000000000,

    "SPEED_100GB": 100000000000,
    "SPEED_100GB_2LANE": 100000000000,
    "openconfig-if-ethernet:SPEED_100GB": 100000000000,
    "openconfig-if-ethernet:SPEED_100GB_2LANE": 100000000000,

    "SPEED_200GB_4LANE": 200000000000,
    "SPEED_200GB_8LANE": 200000000000,
    "openconfig-if-ethernet:SPEED_200GB_4LANE": 200000000000,
    "openconfig-if-ethernet:SPEED_200GB_8LANE": 200000000000,

    "SPEED_400GB": 400000000000,
    "openconfig-if-ethernet:SPEED_400GB": 400000000000,
}

COUNTER_FIELDS = [
    "in_octets",
    "out_octets",
    "in_pkts",
    "out_pkts",
    "in_unicast_pkts",
    "out_unicast_pkts",
    "in_multicast_pkts",
    "out_multicast_pkts",
    "in_broadcast_pkts",
    "out_broadcast_pkts",
    "in_errors",
    "out_errors",
    "in_discards",
    "out_discards",
    "in_fcs_errors",
]

CISCO_COUNTERS = {
    "statistics/in_octets": "in_octets",
    "statistics/out_octets": "out_octets",
    "statistics/in_unicast_pkts": "in_unicast_pkts",
    "statistics/out_unicast_pkts": "out_unicast_pkts",
    "statistics/in_multicast_pkts": "in_multicast_pkts",
    "statistics/out_multicast_pkts": "out_multicast_pkts",
    "statistics/in_broadcast_pkts": "in_broadcast_pkts",
    "statistics/out_broadcast_pkts": "out_broadcast_pkts",
    "statistics/in_errors": "in_errors",
    "statistics/out_errors": "out_errors",
    "statistics/in_discards": "in_discards",
    "statistics/out_discards": "out_discards",
    "statistics/in_crc_errors": "in_fcs_errors",
}

def source_value(metric):
    if "source" in metric.tags:
        return metric.tags["source"]
    return ""

def interface_value(metric):
    if "name" in metric.tags:
        return metric.tags["name"]
    if "name" in metric.fields:
        return str(metric.fields["name"])
    return ""

def add_identity(src, dst, vendor):
    source = source_value(src)

    dst.tags["vendor"] = vendor
    dst.tags["interface"] = interface_value(src)

    if vendor == "arista":
        if source in ARISTA_DEVICES:
            dst.tags["device"] = ARISTA_DEVICES[source]
        else:
            dst.tags["device"] = source

        dst.tags["mgmt_ip"] = source

    elif vendor == "nokia":
        dst.tags["device"] = "S4"
        dst.tags["mgmt_ip"] = source

    elif vendor == "cisco":
        dst.tags["device"] = source

        if source in CISCO_MGMT:
            dst.tags["mgmt_ip"] = CISCO_MGMT[source]

def normalize_admin(value):
    if value == "UP" or value == "if-state-up":
        return "UP"

    if value == "DOWN" or value == "if-state-down":
        return "DOWN"

    if value == "TEST" or value == "if-state-test":
        return "TEST"

    return "UNKNOWN"

def normalize_oper(value):
    if value == "UP" or value == "if-oper-state-ready":
        return "UP"

    if value == "DOWN":
        return "DOWN"

    if value == "if-oper-state-no-pass":
        return "DOWN"

    if value == "if-oper-state-lower-layer-down":
        return "DOWN"

    if value == "if-oper-state-not-present":
        return "DOWN"

    if value == "if-oper-state-dormant":
        return "DORMANT"

    if value == "if-oper-state-test":
        return "TEST"

    return "UNKNOWN"

def build_state(metric, vendor):
    out = Metric("net_ifstate")
    out.time = metric.time

    have_fields = False

    add_identity(metric, out, vendor)

    if "admin_status" in metric.fields:
        out.fields["admin_status"] = normalize_admin(
            metric.fields["admin_status"]
        )
        have_fields = True

    if "oper_status" in metric.fields:
        out.fields["oper_status"] = normalize_oper(
            metric.fields["oper_status"]
        )
        have_fields = True

    if "description" in metric.fields:
        out.fields["description"] = metric.fields["description"]
        have_fields = True

    if "ifindex" in metric.fields:
        out.fields["ifindex"] = int(metric.fields["ifindex"])
        have_fields = True

    if "if_index" in metric.fields:
        out.fields["ifindex"] = int(metric.fields["if_index"])
        have_fields = True

    if "mtu" in metric.fields:
        out.fields["mtu"] = int(metric.fields["mtu"])
        have_fields = True

    if "type" in metric.fields:
        out.fields["type"] = metric.fields["type"]
        have_fields = True

    if "interface_type" in metric.fields:
        out.fields["type"] = metric.fields["interface_type"]
        have_fields = True

    if "duplex_mode" in metric.fields:
        out.fields["duplex_mode"] = metric.fields["duplex_mode"]
        have_fields = True

    # Cisco already provides speed in bits/sec.
    if vendor == "cisco" and "speed" in metric.fields:
        out.fields["speed_bps"] = int(metric.fields["speed"])
        have_fields = True

    # Arista and SR Linux return OpenConfig speed enumerations.
    if "port_speed" in metric.fields:
        speed = metric.fields["port_speed"]

        if speed in SPEEDS:
            out.fields["speed_bps"] = int(SPEEDS[speed])
            have_fields = True

    if not have_fields:
        return None

    return out

def build_counters(metric, vendor):
    out = Metric("net_ifcounters")
    out.time = metric.time

    have_fields = False

    add_identity(metric, out, vendor)

    if vendor == "cisco":
        for src in CISCO_COUNTERS:
            if src in metric.fields:
                out.fields[CISCO_COUNTERS[src]] = metric.fields[src]
                have_fields = True

        # IOS-XE does not give us one convenient in_pkts/out_pkts field
        # in this stream, so derive totals from packet classes.
        in_total = 0
        have_in = False

        for field in [
            "statistics/in_unicast_pkts",
            "statistics/in_multicast_pkts",
            "statistics/in_broadcast_pkts"
        ]:
            if field in metric.fields:
                in_total += metric.fields[field]
                have_in = True

        if have_in:
            out.fields["in_pkts"] = in_total
            have_fields = True

        out_total = 0
        have_out = False

        for field in [
            "statistics/out_unicast_pkts",
            "statistics/out_multicast_pkts",
            "statistics/out_broadcast_pkts"
        ]:
            if field in metric.fields:
                out_total += metric.fields[field]
                have_out = True

        if have_out:
            out.fields["out_pkts"] = out_total
            have_fields = True

    else:
        for field in COUNTER_FIELDS:
            if field in metric.fields:
                out.fields[field] = metric.fields[field]
                have_fields = True

    if not have_fields:
        return None

    return out

def apply(metric):
    generated = []

    if metric.name == "arista_ifstate":
        m = build_state(metric, "arista")
        if m != None:
            generated.append(m)

    elif metric.name == "arista_ifcounters":
        m = build_counters(metric, "arista")
        if m != None:
            generated.append(m)

    elif metric.name == "srlinux_ifstate":
        m = build_state(metric, "nokia")
        if m != None:
            generated.append(m)

    elif metric.name == "srlinux_ifcounters":
        m = build_counters(metric, "nokia")
        if m != None:
            generated.append(m)

    elif metric.name == "Cisco-IOS-XE-interfaces-oper:interfaces/interface":
        state = build_state(metric, "cisco")
        counters = build_counters(metric, "cisco")

        if state != None:
            generated.append(state)

        if counters != None:
            generated.append(counters)

    # Keep the original vendor metric too.
    result = [metric]

    for m in generated:
        result.append(m)

    return result
'''
