# Cross-vendor Tier 3 routing-neighbor normalization
#
# Raw vendor measurements are preserved.
#
# Additional canonical measurement:
#
#   net_neighbor_state
#
# Canonical tags:
#   vendor
#   device
#   mgmt_ip
#   protocol
#   neighbor
#   interface
#   vrf
#   address_family
#   area
#   instance
#   level
#
# Canonical fields:
#   session_state
#   session_up
#   neighbor_address   (when supplied by the vendor stream)

[[processors.starlark]]
  order = 40

  namepass = [
    "arista_isis_adj",

    "Cisco-IOS-XE-bgp-oper:bgp-state-data/neighbors/neighbor",
    "Cisco-IOS-XE-ospf-oper:ospf-oper-data/ospfv2-instance/ospfv2-area/ospfv2-interface/ospfv2-neighbor",
    "Cisco-IOS-XE-ospf-oper:ospf-oper-data/ospfv3-router/ospfv3-afi/ospfv3-area/ospfv3-intf/ospfv3-nbr",

    "srlinux_ospf_adj"
  ]

  source = '''
ARISTA_DEVICES = {
    "172.20.20.14": "R1",
    "172.20.20.5":  "R2",
    "172.20.20.8":  "S1",
    "172.20.20.11": "S2",
    "172.20.20.7":  "S3",
}

CISCO_MGMT = {
    "R3": "172.20.20.9",
    "R4": "172.20.20.13",
}

CISCO_BGP = "Cisco-IOS-XE-bgp-oper:bgp-state-data/neighbors/neighbor"

CISCO_OSPFV2 = "Cisco-IOS-XE-ospf-oper:ospf-oper-data/ospfv2-instance/ospfv2-area/ospfv2-interface/ospfv2-neighbor"

CISCO_OSPFV3 = "Cisco-IOS-XE-ospf-oper:ospf-oper-data/ospfv3-router/ospfv3-afi/ospfv3-area/ospfv3-intf/ospfv3-nbr"

NOKIA_INSTANCE_TAG = "/srl_nokia-network-instance:network-instance/protocols/srl_nokia-ospf:ospf/instance/name"


def tag_value(metric, key):
    if key in metric.tags:
        return str(metric.tags[key])

    return ""


def add_tag(metric, key, value):
    if value != "":
        metric.tags[key] = str(value)


def ipv4_router_id(value):
    n = int(value)

    a = n // 16777216
    b = (n // 65536) % 256
    c = (n // 256) % 256
    d = n % 256

    return (
        str(a) + "." +
        str(b) + "." +
        str(c) + "." +
        str(d)
    )


def canonical_state(protocol, value):
    state = str(value)

    if protocol == "bgp":
        if state == "fsm-established":
            return "ESTABLISHED"

    if protocol == "ospfv2":
        if state == "ospf-nbr-full":
            return "FULL"

        if state == "full":
            return "FULL"

        if state == "srl_nokia-ospf-types:full":
            return "FULL"

    if protocol == "ospfv3":
        if state == "full":
            return "FULL"

        if state == "srl_nokia-ospf-types:full":
            return "FULL"

    if protocol == "isis":
        if state == "UP":
            return "UP"

    # Preserve the vendor state if it is not one of the
    # explicitly normalized states above.
    return state


def is_up(protocol, value):
    state = str(value)

    if protocol == "bgp":
        if state == "fsm-established":
            return 1

    if protocol == "ospfv2":
        if state == "ospf-nbr-full":
            return 1

        if state == "full":
            return 1

        if state == "srl_nokia-ospf-types:full":
            return 1

    if protocol == "ospfv3":
        if state == "full":
            return 1

        if state == "srl_nokia-ospf-types:full":
            return 1

    if protocol == "isis":
        if state == "UP":
            return 1

    return 0


def new_neighbor(metric, vendor, device, mgmt_ip, protocol):
    out = Metric("net_neighbor_state")
    out.time = metric.time

    out.tags["vendor"] = vendor
    out.tags["device"] = device
    out.tags["mgmt_ip"] = mgmt_ip
    out.tags["protocol"] = protocol

    return out


def set_state(out, protocol, value):
    out.fields["session_state"] = canonical_state(
        protocol,
        value,
    )

    out.fields["session_up"] = is_up(
        protocol,
        value,
    )


def apply(metric):

    # ========================================================
    # Arista EOS - IS-IS
    # ========================================================

    if metric.name == "arista_isis_adj":

        if "adjacency_state" not in metric.fields:
            return metric

        source = tag_value(metric, "source")

        # Tier 3 intentionally excludes R5.
        if source not in ARISTA_DEVICES:
            return metric

        out = new_neighbor(
            metric,
            "arista",
            ARISTA_DEVICES[source],
            source,
            "isis",
        )

        add_tag(
            out,
            "neighbor",
            tag_value(metric, "system_id"),
        )

        add_tag(
            out,
            "interface",
            tag_value(metric, "interface_id"),
        )

        add_tag(
            out,
            "vrf",
            tag_value(metric, "name"),
        )

        add_tag(
            out,
            "level",
            tag_value(metric, "level_number"),
        )

        set_state(
            out,
            "isis",
            metric.fields["adjacency_state"],
        )

        return [metric, out]


    # ========================================================
    # Cisco IOS-XE - BGP
    # ========================================================

    if metric.name == CISCO_BGP:

        # Only the narrow production BGP subscription.
        if "subscription" not in metric.tags:
            return metric

        if metric.tags["subscription"] != "109":
            return metric

        if "session_state" not in metric.fields:
            return metric

        source = tag_value(metric, "source")

        if source not in CISCO_MGMT:
            return metric

        out = new_neighbor(
            metric,
            "cisco",
            source,
            CISCO_MGMT[source],
            "bgp",
        )

        add_tag(
            out,
            "neighbor",
            tag_value(metric, "neighbor_id"),
        )

        add_tag(
            out,
            "vrf",
            tag_value(metric, "vrf_name"),
        )

        add_tag(
            out,
            "address_family",
            tag_value(metric, "afi_safi"),
        )

        set_state(
            out,
            "bgp",
            metric.fields["session_state"],
        )

        return [metric, out]


    # ========================================================
    # Cisco IOS-XE - OSPFv2
    # ========================================================

    if metric.name == CISCO_OSPFV2:

        if "state" not in metric.fields:
            return metric

        source = tag_value(metric, "source")

        if source not in CISCO_MGMT:
            return metric

        out = new_neighbor(
            metric,
            "cisco",
            source,
            CISCO_MGMT[source],
            "ospfv2",
        )

        nbr_id = tag_value(metric, "nbr_id")

        if nbr_id != "":
            out.tags["neighbor"] = ipv4_router_id(nbr_id)

        add_tag(
            out,
            "interface",
            tag_value(metric, "name"),
        )

        out.tags["vrf"] = "default"
        out.tags["address_family"] = "ipv4"

        add_tag(
            out,
            "area",
            tag_value(metric, "area_id"),
        )

        add_tag(
            out,
            "instance",
            tag_value(metric, "instance_id"),
        )

        set_state(
            out,
            "ospfv2",
            metric.fields["state"],
        )

        if "address" in metric.fields:
            out.fields["neighbor_address"] = str(
                metric.fields["address"]
            )

        return [metric, out]


    # ========================================================
    # Cisco IOS-XE - OSPFv3
    # ========================================================

    if metric.name == CISCO_OSPFV3:

        if "nbr_state" not in metric.fields:
            return metric

        source = tag_value(metric, "source")

        if source not in CISCO_MGMT:
            return metric

        out = new_neighbor(
            metric,
            "cisco",
            source,
            CISCO_MGMT[source],
            "ospfv3",
        )

        add_tag(
            out,
            "neighbor",
            tag_value(metric, "nbr_id"),
        )

        add_tag(
            out,
            "interface",
            tag_value(metric, "name"),
        )

        out.tags["vrf"] = "default"

        af = tag_value(metric, "af")

        if af == "ospfv3-address-family-ipv6":
            out.tags["address_family"] = "ipv6"
        elif af != "":
            out.tags["address_family"] = af

        add_tag(
            out,
            "area",
            tag_value(metric, "area_id"),
        )

        add_tag(
            out,
            "instance",
            tag_value(metric, "process_id"),
        )

        set_state(
            out,
            "ospfv3",
            metric.fields["nbr_state"],
        )

        if "address" in metric.fields:
            out.fields["neighbor_address"] = str(
                metric.fields["address"]
            )

        return [metric, out]


    # ========================================================
    # Nokia SR Linux - OSPFv2 / OSPFv3
    # ========================================================

    if metric.name == "srlinux_ospf_adj":

        if "adjacency_state" not in metric.fields:
            return metric

        source = tag_value(metric, "source")
        instance = tag_value(metric, NOKIA_INSTANCE_TAG)

        if instance == "1":
            protocol = "ospfv2"
            address_family = "ipv4"

        elif instance == "2":
            protocol = "ospfv3"
            address_family = "ipv6"

        else:
            return metric

        out = new_neighbor(
            metric,
            "nokia",
            "S4",
            source,
            protocol,
        )

        add_tag(
            out,
            "neighbor",
            tag_value(metric, "router_id"),
        )

        add_tag(
            out,
            "interface",
            tag_value(metric, "interface_name"),
        )

        add_tag(
            out,
            "vrf",
            tag_value(metric, "name"),
        )

        out.tags["address_family"] = address_family

        add_tag(
            out,
            "area",
            tag_value(metric, "area_id"),
        )

        out.tags["instance"] = instance

        set_state(
            out,
            protocol,
            metric.fields["adjacency_state"],
        )

        return [metric, out]


    return metric
'''
