# Nokia SR Linux - S4
# gNMI/OpenConfig interface telemetry

[[inputs.gnmi]]
  addresses = ["172.20.20.4:57400"]

  username = "$SRLINUX_USERNAME"
  password = "$SRLINUX_PASSWORD"

  encoding = "json_ietf"
  redial = "10s"

  tls_enable = true
  insecure_skip_verify = true

  # SR Linux is queried using origin "openconfig", but responses
  # identify the YANG module as "openconfig-interfaces".
  # Map that returned path to our measurement name.
  [inputs.gnmi.aliases]
    srlinux_ifcounters = "openconfig-interfaces:/interfaces/interface/state/counters"

  [[inputs.gnmi.subscription]]
    name = "srlinux_ifcounters"
    origin = "openconfig"
    path = "/interfaces/interface/state/counters"
    subscription_mode = "sample"
    sample_interval = "5s"

# Convert SR Linux JSON-IETF counter strings into numeric fields.
[[processors.converter]]
  namepass = ["srlinux_ifcounters"]

  [processors.converter.fields]
    integer = [
      "in_*",
      "out_*",
      "carrier_transitions",
      "interface_transitions",
      "link_transitions"
    ]
