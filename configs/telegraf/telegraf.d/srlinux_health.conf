# Nokia SR Linux - Tier 2 device health
#
# SR Linux does not allow OpenConfig and native origins to be mixed
# within the same gNMI Subscribe RPC.
#
# Therefore:
#   gNMI session 1 = OpenConfig CPU + uptime
#   gNMI session 2 = native memory utilization


# ============================================================
# OpenConfig health
# CPU:    30 seconds
# Uptime: 60 seconds
# ============================================================

[[inputs.gnmi]]
  addresses = ["172.20.20.4:57400"]

  username = "$SRLINUX_USERNAME"
  password = "$SRLINUX_PASSWORD"

  encoding = "json_ietf"
  redial = "10s"

  tls_enable = true
  insecure_skip_verify = true

  [inputs.gnmi.aliases]
    srlinux_cpu = "openconfig-system:/system/cpus/cpu/state/total/instant"
    srlinux_uptime = "openconfig-system:/system/state/up-time"

  [[inputs.gnmi.subscription]]
    name = "srlinux_cpu"
    origin = "openconfig"
    path = "/system/cpus/cpu[index=ALL]/state/total/instant"
    subscription_mode = "sample"
    sample_interval = "30s"

  [[inputs.gnmi.subscription]]
    name = "srlinux_uptime"
    origin = "openconfig"
    path = "/system/state/up-time"
    subscription_mode = "sample"
    sample_interval = "60s"


# ============================================================
# Native SR Linux health
# Memory: 30 seconds
# ============================================================

[[inputs.gnmi]]
  addresses = ["172.20.20.4:57400"]

  username = "$SRLINUX_USERNAME"
  password = "$SRLINUX_PASSWORD"

  encoding = "json_ietf"
  redial = "10s"

  tls_enable = true
  insecure_skip_verify = true

  [inputs.gnmi.aliases]
    srlinux_memory = "srl_nokia-platform:/platform/srl_nokia-platform-control:control/srl_nokia-platform-memory:memory/utilization"

  [[inputs.gnmi.subscription]]
    name = "srlinux_memory"
    origin = "native"
    path = "/platform/control[slot=A]/memory/utilization"
    subscription_mode = "sample"
    sample_interval = "30s"


# SR Linux JSON-IETF returns OpenConfig uptime as a quoted integer.
[[processors.converter]]
  namepass = ["srlinux_uptime"]

  [processors.converter.fields]
    integer = ["up_time"]
