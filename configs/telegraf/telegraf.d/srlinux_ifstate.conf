# Nokia SR Linux - interface operational state
# Separate from the existing 5-second interface counter stream.

[[inputs.gnmi]]
  addresses = ["172.20.20.4:57400"]

  username = "$SRLINUX_USERNAME"
  password = "$SRLINUX_PASSWORD"

  encoding = "json_ietf"
  redial = "10s"

  tls_enable = true
  insecure_skip_verify = true

  name_override = "srlinux_ifstate"

  # Keep Tier-1 operational metadata only.
  fieldinclude = [
    "name",
    "admin_status",
    "oper_status",
    "enabled",
    "ifindex",
    "mtu",
    "type",
    "last_change",
    "port_speed"
  ]

  # SR Linux response paths use the actual OpenConfig module names.
  [inputs.gnmi.aliases]
    srlinux_ifstate_base = "openconfig-interfaces:/interfaces/interface/state"
    srlinux_ifstate_ethernet = "openconfig-interfaces:/interfaces/interface/ethernet/state"

  [[inputs.gnmi.subscription]]
    name = "srlinux_ifstate_base"
    origin = "openconfig"
    path = "/interfaces/interface/state"
    subscription_mode = "sample"
    sample_interval = "10s"

  [[inputs.gnmi.subscription]]
    name = "srlinux_ifstate_ethernet"
    origin = "openconfig"
    path = "/interfaces/interface/ethernet/state"
    subscription_mode = "sample"
    sample_interval = "10s"
