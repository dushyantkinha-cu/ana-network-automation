# Nokia SR Linux - Tier 3 routing telemetry
# S4: OSPFv2 + OSPFv3 adjacency state

[[inputs.gnmi]]
  addresses = ["172.20.20.4:57400"]

  username = "$SRLINUX_USERNAME"
  password = "$SRLINUX_PASSWORD"

  encoding = "json_ietf"
  redial = "10s"

  tls_enable = true
  insecure_skip_verify = true

  path_guessing_strategy = "subscription"

  [inputs.gnmi.aliases]
    srlinux_ospf_adj = "srl_nokia-network-instance:/network-instance/protocols/ospf/instance/area/interface/neighbor/adjacency-state"

  [[inputs.gnmi.subscription]]
    name = "srlinux_ospf_adj"
    origin = "native"
    path = "/network-instance[name=default]/protocols/ospf/instance/area/interface/neighbor/adjacency-state"
    subscription_mode = "sample"
    sample_interval = "10s"
