hostname R2
!
interface Ethernet1
   no switchport
   ip address 10.3.0.4/31
   ipv6 address fd12:3456:7890:c::4/127
   isis enable 1
!
interface Ethernet3
   no switchport
   ip address 10.1.0.4/31
   ipv6 address fd12:3456:7890:a::4/127
   ipv6 ospf 1 area 0.0.0.0
!
interface Loopback0
   ip address 10.255.255.12/32
   ipv6 address fd12:3456:7890:ffff::12/128
   ipv6 ospf 1 area 0.0.0.0
   isis enable 1
!

ip prefix-list PL-VLAN-NETS seq 10 permit 172.16.10.0/24
ip prefix-list PL-VLAN-NETS seq 20 permit 172.16.20.0/24
ipv6 prefix-list PL-VLAN-NETS-V6
   seq 10 permit fd12:3456:7890::/48 le 64
ipv6 prefix-list PL-WEB-V6-ISIS
   seq 10 permit 2001:db8::/112 le 128
!

route-map RM-ISIS-TO-OSPF permit 10
   match ip address prefix-list PL-VLAN-NETS
!
route-map RM-ISIS-TO-OSPF3 permit 10
   match ipv6 address prefix-list PL-VLAN-NETS-V6
!
route-map RM-OSPF3-TO-ISIS permit 10
   match ipv6 address prefix-list PL-WEB-V6-ISIS
!

router isis 1
   net 49.0001.0102.5525.5012.00
   is-type level-1
   redistribute ospf include leaked match external
   !
   address-family ipv4 unicast
   !
   address-family ipv6 unicast
      redistribute ospfv3 match external route-map RM-OSPF3-TO-ISIS
      multi-topology
!

router ospf 1
   router-id 10.255.255.12
   passive-interface Loopback0
   redistribute isis level-1 route-map RM-ISIS-TO-OSPF
   network 10.1.0.0/16 area 0.0.0.0
   network 10.255.255.12/32 area 0.0.0.0
   max-lsa 12000
!

ipv6 router ospf 1
   router-id 10.255.255.12
   redistribute isis level-1 route-map RM-ISIS-TO-OSPF3
!
