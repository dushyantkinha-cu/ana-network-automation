hostname R4
!
interface GigabitEthernet2
 ip address 10.1.0.11 255.255.255.254
 ip nat inside
 negotiation auto
 ipv6 address fd12:3456:7890:a::b/127
 ipv6 ospf 1 area 0
!
interface GigabitEthernet3
 ip address 10.1.0.8 255.255.255.254
 ip nat inside
 negotiation auto
 ipv6 address fd12:3456:7890:a::8/127
 ipv6 ospf 1 area 0
!
interface GigabitEthernet4
 ip address 203.0.114.2 255.255.255.254
 ip nat outside
 negotiation auto
 ipv6 address 2001:db8:1::2/127
!
interface Loopback0
 ip address 10.255.255.14 255.255.255.255
 ipv6 address fd12:3456:7890:ffff::14/128
 ipv6 ospf 1 area 0
!

ipv6 prefix-list PL-VLAN-V6 seq 10 permit FD12:3456:7890::/48 le 64
ipv6 prefix-list PL-WEB-V6 seq 10 permit 2001:DB8::/112 le 128
!

route-map RM-OSPF3-TO-BGP permit 10
 match ipv6 address prefix-list PL-VLAN-V6
!
route-map RM-BGP-TO-OSPF3 permit 10
 match ipv6 address prefix-list PL-WEB-V6
!

ip access-list standard NAT_ACL
 10 permit 10.0.0.0 0.255.255.255
 20 permit 0.0.0.0 255.255.255.0
 30 permit 172.16.10.0 0.0.0.255
 40 permit 172.16.20.0 0.0.0.255
!

ip nat inside source list NAT_ACL interface GigabitEthernet4 overload
!

router ospfv3 1
 !
 address-family ipv6 unicast
  redistribute bgp 65004 route-map RM-BGP-TO-OSPF3
  router-id 10.255.255.14
 exit-address-family
!

router ospf 1
 router-id 10.255.255.14
 max-lsa 12000
 redistribute bgp 65004
 passive-interface Loopback0
 network 10.1.0.0 0.0.255.255 area 0
 network 10.255.255.14 0.0.0.0 area 0
!

router bgp 65004
 bgp router-id 10.255.255.14
 bgp log-neighbor-changes
 neighbor 2001:DB8:1::3 remote-as 65005
 neighbor 203.0.114.3 remote-as 65005
 !
 address-family ipv4
  no neighbor 2001:DB8:1::3 activate
  neighbor 203.0.114.3 activate
 exit-address-family
 !
 address-family ipv6
  redistribute ospf 1 match internal external 1 external 2 route-map RM-OSPF3-TO-BGP
  neighbor 2001:DB8:1::3 activate
 exit-address-family
!

snmp-server group ana-lab v3 priv read ana-lab-view
snmp-server view ana-lab-view iso included
snmp-server trap-source GigabitEthernet1
snmp-server enable traps snmp linkdown
snmp-server host 10.224.76.14 vrf clab-mgmt version 3 priv admin
!
! SNMP user authentication/privacy credentials are intentionally external
! to NetBox and Git and are not rendered by this template.
!
end
