hostname S1
!
vlan 10,20,30,50
!
interface Ethernet1
   no switchport
   ip address 10.3.0.3/31
   ipv6 address fd12:3456:7890:c::3/127
   isis enable 1
!
interface Ethernet2
   switchport trunk allowed vlan 10,20,30,50
   switchport mode trunk
!
interface Ethernet3
   switchport access vlan 10
!
interface Ethernet4
   switchport access vlan 20
!
interface Loopback0
   ip address 10.255.255.1/32
   ipv6 address fd12:3456:7890:ffff::1/128
   isis enable 1
!
interface Vlan10
   ip address 172.16.10.4/24
   ipv6 address fd12:3456:7890:10::4/64
   isis enable 1
   vrrp 10 priority-level 150
   vrrp 10 ipv4 172.16.10.1
   vrrp 10 ipv6 fd12:3456:7890:10::1
!
interface Vlan20
   ip address 172.16.20.4/24
   ipv6 address fd12:3456:7890:20::4/64
   isis enable 1
   vrrp 20 priority-level 150
   vrrp 20 ipv4 172.16.20.1
   vrrp 20 ipv6 fd12:3456:7890:20::1
!
interface Vlan30
   ipv6 address fd12:3456:7890:30::4/64
   isis enable 1
   vrrp 30 priority-level 150
   vrrp 30 ipv6 fd12:3456:7890:30::1
!
interface Vlan50
   ip address 10.3.0.0/31
   ipv6 address fd12:3456:7890:c::/127
   isis enable 1
!

router isis 1
   net 49.0001.0102.5525.5001.00
   is-type level-1
   !
   address-family ipv4 unicast
   !
   address-family ipv6 unicast
      multi-topology
!
