hostname S3
!
interface Ethernet1
   no switchport
   ip address 10.1.0.0/31
   ipv6 address fd12:3456:7890:a::/127
   ipv6 ospf 1 area 0.0.0.0
!
interface Ethernet2
   no switchport
   ip address 10.1.0.3/31
   ipv6 address fd12:3456:7890:a::3/127
   ipv6 ospf 1 area 0.0.0.0
!
interface Ethernet3
   no switchport
   ip address 10.1.0.7/31
   ipv6 address fd12:3456:7890:a::7/127
   ipv6 ospf 1 area 0.0.0.0
!
interface Loopback0
   ip address 10.255.255.3/32
   ipv6 address fd12:3456:7890:ffff::3/128
   ipv6 ospf 1 area 0.0.0.0
!

router ospf 1
   router-id 10.255.255.3
   passive-interface Loopback0
   network 10.1.0.0/16 area 0.0.0.0
   network 10.255.255.3/32 area 0.0.0.0
   max-lsa 12000
!

ipv6 router ospf 1
   router-id 10.255.255.3
   passive-interface Loopback0
!
