interface ethernet-1/1 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            admin-state enable
            address 10.1.0.1/31 {
            }
        }
        ipv6 {
            admin-state enable
            address fd12:3456:7890:a::1/127 {
            }
        }
    }
}
interface ethernet-1/2 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            admin-state enable
            address 10.1.0.9/31 {
            }
        }
        ipv6 {
            admin-state enable
            address fd12:3456:7890:a::9/127 {
            }
        }
    }
}
interface ethernet-1/3 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            admin-state enable
            address 10.1.0.5/31 {
            }
        }
        ipv6 {
            admin-state enable
            address fd12:3456:7890:a::5/127 {
            }
        }
    }
}
interface lo0 {
    admin-state enable
    subinterface 0 {
        ipv4 {
            admin-state enable
            address 10.255.255.4/32 {
            }
        }
        ipv6 {
            admin-state enable
            address fd12:3456:7890:ffff::4/128 {
            }
        }
    }
}

network-instance default {
    type default
    interface ethernet-1/1.0 {
    }
    interface ethernet-1/2.0 {
    }
    interface ethernet-1/3.0 {
    }
    interface lo0.0 {
    }
    protocols {
        ospf {
            instance 1 {
                admin-state enable
                version ospf-v2
                router-id 10.255.255.4
                area 0.0.0.0 {
                    interface ethernet-1/1.0 {
                    }
                    interface ethernet-1/2.0 {
                    }
                    interface ethernet-1/3.0 {
                    }
                    interface lo0.0 {
                        passive true
                    }
                }
            }
            instance 2 {
                admin-state enable
                version ospf-v3
                address-family ipv6-unicast
                router-id 10.255.255.4
                area 0.0.0.0 {
                    interface ethernet-1/1.0 {
                    }
                    interface ethernet-1/2.0 {
                    }
                    interface ethernet-1/3.0 {
                    }
                    interface lo0.0 {
                        passive true
                    }
                }
            }
        }
    }
}
